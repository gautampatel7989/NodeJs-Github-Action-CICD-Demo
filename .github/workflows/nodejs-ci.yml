
name: Node.js CI/CD

on:
  workflow_run:
    workflows:
      - Node.js Production CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: node-cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-dev-env:
    name: Deploy to Development
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: development

    steps:
      - name: Download validated build artifact
        uses: actions/download-artifact@v7
        with:
          name: node-api-build-node-22
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify artifact
        run: |
          test -d dist
          test "$(find dist -type f | wc -l)" -gt 0
          echo "Development artifact verified"

      - name: Deploy to Development
        run: |
          echo "Replace with actual development deployment commands"
          echo "Deployment target: development"
      - name: Print Environment Configuration
        env: 
            APP_ENV: ${{ vars.APP_ENV }}
        run: |
          echo "APP_ENV: $APP_ENV"


  deploy-staging-env:
    name: Deploy to Staging
    needs: deploy-dev-env
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: staging

    steps:
      - name: Download validated build artifact
        uses: actions/download-artifact@v7
        with:
          name: node-api-build-node-22
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Staging
        run: |
          echo "Replace with actual staging deployment commands"
          echo "Deployment target: staging"

      - name: Staging smoke test
        run: |
          echo "Replace with actual staging health-check command"
      - name: Print Environment Configuration
        env: 
            APP_ENV: ${{ vars.APP_ENV }}
        run: |
          echo "APP_ENV: $APP_ENV"

  deploy-production-env:
    name: Deploy to Production
    needs: deploy-staging-env
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    steps:
      - name: Download validated build artifact
        uses: actions/download-artifact@v7
        with:
          name: node-api-build-node-22
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Production
        run: |
          echo "Replace with actual production deployment commands"
          echo "Deployment target: production"

      - name: Production smoke test
        run: |
          echo "Replace with actual production health-check command"
      - name: Print Environment Configuration
        env: 
            APP_ENV: ${{ vars.APP_ENV }}
        run: |
          echo "APP_ENV: $APP_ENV"
