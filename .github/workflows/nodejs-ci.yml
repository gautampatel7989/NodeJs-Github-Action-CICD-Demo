
name: Node.js CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'dependabot/**'

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-test-build:
    name: run-test-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show branch information
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Ref: $BRANCH_NAME"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build application
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm run build

      - name: Print failure message
        if: failure()
        run: echo "A previous step failed. Please check the logs."
